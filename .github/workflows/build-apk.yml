name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Moonlit Library APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Moonlit-Library.apk
          ls -lh build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlit-Library-APK
          path: build-output/Moonlit-Library.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: apk-latest
          name: "Moonlit Library Android App 🌙"
          body: |
            ## Moonlit Library for Android 📱✨
            
            Welcome to the mobile Android edition of Moonlit Library!
            
            ### 📥 Download & Install
            1. Download the attached **`Moonlit-Library.apk`** below on your Android phone.
            2. Open the file and tap **Install** (if prompted, allow "Install unknown apps").
            3. Launch Moonlit Library and enjoy your peaceful study universe!
            
            ### 🌙 Included Features:
            - Full mobile-responsive UI with dreamy moonlight theme
            - Shagun's interactive reading welcome experience & spoken voice
            - Built-in Moonlit Reader with PowerPoint (.pptx) presentation viewer
            - 1-Click access for Sagun Singh (`Sagun@463gmail.com`)
            - Mobile OTP login support
          files: build-output/Moonlit-Library.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
